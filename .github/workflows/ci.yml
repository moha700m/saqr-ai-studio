name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "engine[dev]"
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Hardware diagnostics (real)
        run: saqr doctor --json > diagnostics.json
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}-py${{ matrix.python }}
          path: diagnostics.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: node ../scripts/prepare_web_assets.mjs
      - run: npm run build
      - name: Bundle budget
        run: |
          size=$(du -sk dist | cut -f1)
          echo "dist=${size}KB"
          test "$size" -lt 40000
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check engine desktop tests --select E,F,W,B --ignore E501
