name: Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "engine[desktop,dev]" pyinstaller

      - name: Web build
        working-directory: web
        run: |
          npm ci
          node ../scripts/prepare_web_assets.mjs
          npm run build

      - name: Freeze app
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build installer/saqr-studio.spec

      - name: Inno Setup
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\saqr-studio.iss

      - name: Smoke test frozen CLI
        run: |
          dist\SaqrAIStudio\SaqrAIStudio.exe doctor --json | Out-File diagnostics.json -Encoding utf8
          Get-Content diagnostics.json

      - uses: actions/upload-artifact@v4
        with:
          name: SAQR-AI-Setup
          path: installer/Output/SAQR-AI-Setup.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/SAQR-AI-Setup.exe
          generate_release_notes: true
