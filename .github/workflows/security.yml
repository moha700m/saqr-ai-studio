name: Security

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r engine/requirements-lock.txt || true
      - name: Secret scan
        run: |
          ! grep -rInE "(api[_-]?key|secret|token)\s*=\s*['\"][A-Za-z0-9_\-]{16,}" engine desktop web/src installer --include="*.py" --include="*.ts" --include="*.tsx" --include="*.ps1"

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm audit --audit-level=high
