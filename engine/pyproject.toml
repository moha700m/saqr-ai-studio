[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saqr-engine"
version = "0.9.0"
description = "SAQR AI Studio inference engine: hardware detection, ONNX face pipeline, local API"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "onnxruntime>=1.17",
  "psutil>=5.9",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.6"]
accelerators = ["onnxruntime-gpu>=1.17"]
dev = ["pytest>=8", "httpx>=0.27", "onnx>=1.15", "ruff>=0.4"]

[project.scripts]
saqr = "saqr_engine.cli:main"

[tool.setuptools.packages.find]
include = ["saqr_engine*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008"]
